[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechmux-cli"
version = "0.1.0"
description = "SpeechMux command-line client (file / batch / mic)"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "speechmux-proto",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.4.6"]
dev = [
    "pytest>=7.0",
    "ruff>=0.3.0",
    "mypy>=1.0",
    "sounddevice>=0.4.6",
]

[project.scripts]
speechmux = "speechmux_cli.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["speechmux_cli"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.mypy]
python_version = "3.10"
strict = true
